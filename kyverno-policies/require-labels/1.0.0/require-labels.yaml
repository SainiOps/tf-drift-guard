apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-owner-environment-labels
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "Required labels missing: owner, environment"
        pattern:
          metadata:
            labels:
              owner: "?*"
              environment: "?*"
